services:
  # --- Redis Cluster (3 masters + 3 replicas) ---
  redis-node-1:
    image: redis:7.2-alpine
    ports:
      - "7001:7001"
    volumes:
      - ./deployments/redis/redis.conf:/etc/redis/redis.conf:ro
    command: ["redis-server", "/etc/redis/redis.conf", "--port", "7001"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - investor-net
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7001", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-node-2:
    image: redis:7.2-alpine
    ports:
      - "7002:7002"
    volumes:
      - ./deployments/redis/redis.conf:/etc/redis/redis.conf:ro
    command: ["redis-server", "/etc/redis/redis.conf", "--port", "7002"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - investor-net
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7002", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-node-3:
    image: redis:7.2-alpine
    ports:
      - "7003:7003"
    volumes:
      - ./deployments/redis/redis.conf:/etc/redis/redis.conf:ro
    command: ["redis-server", "/etc/redis/redis.conf", "--port", "7003"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - investor-net
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7003", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-node-4:
    image: redis:7.2-alpine
    ports:
      - "7004:7004"
    volumes:
      - ./deployments/redis/redis.conf:/etc/redis/redis.conf:ro
    command: ["redis-server", "/etc/redis/redis.conf", "--port", "7004"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - investor-net
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7004", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-node-5:
    image: redis:7.2-alpine
    ports:
      - "7005:7005"
    volumes:
      - ./deployments/redis/redis.conf:/etc/redis/redis.conf:ro
    command: ["redis-server", "/etc/redis/redis.conf", "--port", "7005"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - investor-net
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7005", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-node-6:
    image: redis:7.2-alpine
    ports:
      - "7006:7006"
    volumes:
      - ./deployments/redis/redis.conf:/etc/redis/redis.conf:ro
    command: ["redis-server", "/etc/redis/redis.conf", "--port", "7006"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - investor-net
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7006", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-cluster-init:
    image: redis:7.2-alpine
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
      redis-node-4:
        condition: service_healthy
      redis-node-5:
        condition: service_healthy
      redis-node-6:
        condition: service_healthy
    volumes:
      - ./deployments/redis/init-cluster.sh:/init-cluster.sh:ro
    entrypoint: ["/bin/sh", "/init-cluster.sh"]
    networks:
      - investor-net
    restart: "no"

  # --- Apache Kafka (KRaft mode, 3-broker cluster) ---
  kafka-1:
    image: apache/kafka:3.9.2
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - investor-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  kafka-2:
    image: apache/kafka:3.9.2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - investor-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  kafka-3:
    image: apache/kafka:3.9.2
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - investor-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  kafka-init:
    image: apache/kafka:3.9.2
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    volumes:
      - ./deployments/kafka/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    networks:
      - investor-net
    restart: "no"

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: investor
      POSTGRES_PASSWORD: investor
      POSTGRES_DB: investordb
    volumes:
      - ./deployments/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./deployments/postgres/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - investor-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investor -d investordb"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Cache Middleware (read path) ---
  middleware:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: middleware
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      METRICS_PORT: "9091"
      REDIS_ADDRS: "redis-node-1:7001,redis-node-2:7002,redis-node-3:7003,redis-node-4:7004,redis-node-5:7005,redis-node-6:7006"
      DATABASE_DSN: "postgres://investor:investor@postgres:5432/investordb?sslmode=disable"
      CACHE_TTL: "3600s"
      RECONCILE_INTERVAL: "5m"
      RECONCILE_SAMPLE_SIZE: "100"
    depends_on:
      redis-cluster-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 512M
    networks:
      - investor-net
    restart: unless-stopped

  # --- Profile Service (write path) ---
  profile-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: profile-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: "8081"
      METRICS_PORT: "9092"
      DATABASE_DSN: "postgres://investor:investor@postgres:5432/investordb?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    networks:
      - investor-net
    restart: unless-stopped

  # --- Outbox Relay (transactional outbox -> Kafka) ---
  outbox-relay:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: outbox-relay
    environment:
      METRICS_PORT: "9093"
      DATABASE_DSN: "postgres://investor:investor@postgres:5432/investordb?sslmode=disable"
      KAFKA_BROKERS: "kafka-1:9092,kafka-2:9092,kafka-3:9092"
      KAFKA_TOPIC: "profile-updates"
      OUTBOX_POLL_INTERVAL: "100ms"
      OUTBOX_BATCH_SIZE: "100"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks:
      - investor-net
    restart: unless-stopped

  # --- Invalidation Worker (Kafka -> Redis DEL) ---
  invalidation-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: invalidation-worker
    environment:
      METRICS_PORT: "9094"
      REDIS_ADDRS: "redis-node-1:7001,redis-node-2:7002,redis-node-3:7003,redis-node-4:7004,redis-node-5:7005,redis-node-6:7006"
      KAFKA_BROKERS: "kafka-1:9092,kafka-2:9092,kafka-3:9092"
      KAFKA_TOPIC: "profile-updates"
      KAFKA_GROUP_ID: "cache-invalidation-group"
      KAFKA_DLQ_TOPIC: "profile-updates-dlq"
    depends_on:
      redis-cluster-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - investor-net
    restart: unless-stopped

  # --- Prometheus ---
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-remote-write-receiver"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - investor-net

  # --- k6 (load generator, активируется только профилем bench) ---
  k6:
    image: grafana/k6:0.51.0
    profiles: ["bench"]
    volumes:
      - ./experiments2:/scripts:ro
    networks:
      - investor-net
    entrypoint: ["k6"]

  # --- Grafana ---
  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deployments/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployments/grafana/dashboards:/var/lib/grafana/dashboards:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - investor-net
    depends_on:
      - prometheus

volumes:
  pgdata:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:

networks:
  investor-net:
    driver: bridge
